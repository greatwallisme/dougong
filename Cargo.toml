[workspace]
resolver = "3"
members = [
    "crates/dougong-abi",
    "crates/dougong",
    "crates/dougong-dylib",
    "crates/dougong-wasm",
    "crates/dougong-loader",
    "crates/greeter-plugin",
    "crates/greeter-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greatwallisme/dougong"
keywords = ["plugin-system", "ffi", "wasm", "runtime"]
categories = ["development-tools", "concurrency"]

[workspace.dependencies]
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
wasmtime = "48"
wasmtime-wasi = "48"
wit-bindgen = "0.61"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
# Mutually exclusive with `semicolon_if_nothing_returned` on
# statement-position blocks: the two give opposite requirements for the same
# code shape. We keep the pedantic lint and disable this restriction lint.
semicolon_outside_block = "allow"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# `wasmtime 48` (via async-trait) resolves syn 3 while `wit-bindgen 0.61`
# pins syn 2; the duplicate is transitive and unfixable locally without
# patching upstream. Revisit when wit-bindgen moves to syn 3.
multiple_crate_versions = "allow"
literal_string_with_formatting_args = "allow"
